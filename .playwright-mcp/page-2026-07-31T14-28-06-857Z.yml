    - link "Prof. Laurent Hébert-Dufresne receives the 2026 Erdős-Rényi Prize" [ref=f8e92] [cursor=pointer]:
      - /url: https://www.santafe.edu/news-center/news/laurent-hebert-dufresne-receives-erdos-renyi-prize
    - text: . Our Editor-in-Chief, Prof. Laurent Hébert-Dufresne, has been named the 2026 recipient of the Erdős-Rényi Prize, the Network Science Society’s top honor for early-career researchers in network science, recognizing his foundational contributions to the theory of contagion on complex networks.
  - main [ref=f8e93]:
    - generic [ref=f8e95]:
      - heading "Aims & Scopes" [level=1] [ref=f8e97]
      - generic [ref=f8e98]:
        - paragraph [ref=f8e99]:
          - emphasis [ref=f8e100]: npj Complexity
          - text: "considers research that explores all aspects of complex systems at the interface of multiple fields. The journal covers a broad range of topics including but not limited to:"
        - list [ref=f8e101]:
          - listitem [ref=f8e102]: Network science, including the analysis of complex networks such as social networks, biological networks, infrastructure and information networks
          - listitem [ref=f8e103]: Emergent phenomena, self-organization, and scaling in complex systems
          - listitem [ref=f8e104]: Nonlinear dynamics, chaos theory, and dynamical systems theory
          - listitem [ref=f8e105]: Agent-based modeling and simulation techniques for studying complex systems
          - listitem [ref=f8e106]: Complex adaptive systems, such as adaptive behavior in biological, ecological, and social systems
          - listitem [ref=f8e107]: Multi-scale analysis techniques across different levels of organization, from micro to macro scales
          - listitem [ref=f8e108]: Robustness and resilience of complex systems
          - listitem [ref=f8e109]: Evolutionary dynamics and game theory
          - listitem [ref=f8e110]: Digital humanities, dynamics of information, and science of science
          - listitem [ref=f8e111]: Information processing and computation in complex systems and artificial intelligence
          - listitem [ref=f8e112]: Interdisciplinary approaches to complex problems such as epidemics, climate change, misinformation, governance, and sustainability
        - paragraph [ref=f8e113]:
          - text: The journal offers more choice to Nature Portfolio authors who are seeking a fully open-access and more inclusive platform for publishing their work. The journal is led by complex systems experts who collaborate to cultivate high-quality research. As part of the
          - link "npj Series" [ref=f8e114] [cursor=pointer]:
            - /url: https://www.nature.com/nature-portfolio/about/npj-series
          - text: ", this journal focuses on fostering global partnerships with the research community and other Springer Nature journals."
